<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 95" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <!-- Bistos Logo -->
  <g>
    <!-- Icon Left -->
    <g transform="translate(15, 12)">
      <!-- Blue 'i' dot -->
      <circle cx="16" cy="10" r="5" fill="#004D9F" />
      <!-- Blue vertical slant stem -->
      <polygon points="17,19 23,19 14,64 8,64" fill="#004D9F" />
      <!-- Green 'B' swoosh -->
      <path d="M 23,24 C 30,24 35,28 35,34 C 35,39 31,43 27,45 C 33,47 37,53 36,60 C 35,66 29,69 22,69 C 20,69 18,68 16,68 L 19,63 C 20,63.5 21.5,64 23,64 C 26.5,64 29.5,62 30,58 C 30.5,53 27,49 22,49 L 20,49 L 21,44 L 23,44 C 27,44 29.5,41 29,37 C 28.5,33 25.5,30 22,30 C 20,30 18.5,30.5 17.5,31 L 18,25 C 19.5,24.5 21,24 23,24 Z" fill="#2E8B57" />
    </g>

    <!-- 'bistos' bold black text -->
    <text x="68" y="58" fill="#111827" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="48" font-weight="900" letter-spacing="-1">bistos</text>
    
    <!-- Subtitle 'Bistos America Inc.' -->
    <text x="70" y="78" fill="#374151" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">Bistos America Inc.</text>
  </g>
</svg>

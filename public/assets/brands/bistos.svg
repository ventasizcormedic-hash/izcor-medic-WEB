<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 95" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <!-- Bistos America Inc. Official Brand Logo -->
  <g>
    <!-- Left Icon (Blue slanted stem + green curve) -->
    <g transform="translate(14, 12)">
      <!-- Blue 'i' dot -->
      <circle cx="16.5" cy="9.5" r="5.2" fill="#004D9F" />
      <!-- Blue slanted vertical bar -->
      <polygon points="17.5,18 24,18 14.5,65 8,65" fill="#004D9F" />
      <!-- Green 'B' swoosh curve -->
      <path d="M 23,23 C 30.5,23 36,27 36,33.5 C 36,38.5 32,42.5 28,44.5 C 34.5,46.5 38.5,52.5 37.5,59.5 C 36.5,66 30.5,69 23,69 C 20.5,69 18.5,68.2 16.5,67.8 L 19.5,62.5 C 20.8,63 22,63.5 23.5,63.5 C 27.5,63.5 30.5,61 31,57 C 31.5,52 28,48.5 23,48.5 L 20.5,48.5 L 21.8,43.5 L 24,43.5 C 28,43.5 30.5,40.5 30,36.5 C 29.5,32.5 26.5,29.5 23,29.5 C 21,29.5 19.2,30 18,30.8 L 18.8,24.5 C 20.2,23.8 21.8,23 23,23 Z" fill="#2E8B57" />
    </g>

    <!-- 'bistos' heavy bold lowercase black text -->
    <text x="68" y="58" fill="#000000" font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="50" font-weight="900" letter-spacing="-1.2">bistos</text>
    
    <!-- Subtitle 'Bistos America Inc.' -->
    <text x="70" y="78" fill="#222222" font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.2">Bistos America Inc.</text>
  </g>
</svg>

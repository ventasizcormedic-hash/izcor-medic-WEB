  <g fill="#0018D6">
    <!-- Monogram Box on Left -->
    <rect x="14" y="16" width="62" height="60" fill="none" stroke="#0018D6" stroke-width="1.4" />
    <path d="M 23,24 L 68,24 L 68,32 L 49,32 L 40,56 C 44,55 48.5,55 53.5,56 C 60.5,57.5 64.5,62 63.5,68 C 62.5,73 56,75 47,75 C 36,75 27,68 27,57 C 27,48 31,40 37,32 L 23,32 Z M 38,58 C 35.5,62 35.5,68 43,68 C 49,68 52,66 52,62 C 52,59 48,58 43,58 Z" fill="#0018D6" />
    
    <!-- BOECO Bold Upper Typography -->
    <text x="90" y="48" font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="1.5">BOECO</text>
    <!-- Germany Lower Subtitle with Wide Spacing -->
    <text x="91" y="70" font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="4.8">Germany</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="riesterSphere" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#BDC3C7" />
      <stop offset="100%" stop-color="#5B6770" />
    </radialGradient>
  </defs>
  <!-- Riester Logo (#1E5198) -->
  <g>
    <!-- Left Icon (bracketed target ring + sphere) -->
    <g transform="translate(18, 16)">
      <!-- Left crescent -->
      <path d="M 18,3 C 9,7 3,16 3,24 C 3,32 9,41 18,45 L 21,39 C 15,36 10,29 10,24 C 10,19 15,12 21,9 Z" fill="#1E5198" />
      <!-- Right crescent -->
      <path d="M 30,3 C 39,7 45,16 45,24 C 45,32 39,41 30,45 L 27,39 C 33,36 38,29 38,24 C 38,19 33,12 27,9 Z" fill="#1E5198" />
      <!-- Center sphere -->
      <circle cx="24" cy="24" r="10.5" fill="url(#riesterSphere)" />
    </g>

    <!-- Riester Typography -->
    <text x="76" y="52" fill="#1E5198" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="900" font-style="italic" letter-spacing="-1">Riester</text>
  </g>
</svg>

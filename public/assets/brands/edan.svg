<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <!-- EDAN Logo -->
  <g>
    <!-- Left emblem (leaf icon with figure cutout) -->
    <g transform="translate(18, 12)">
      <!-- Left yellow-green leaf with oval head cutout -->

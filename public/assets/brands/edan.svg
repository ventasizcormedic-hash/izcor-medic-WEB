      <!-- Cutout human head/body in white -->
      <ellipse cx="27" cy="46" rx="4.5" ry="9" fill="#FFFFFF" />
      
      <!-- Right green leaf -->
      <path d="M 33,12 C 33,12 43,18 49,30 C 56,42 54,58 45,67 C 36,75 30,62 31,52 C 32,42 35,30 35,21 C 35,14 33,12 33,12 Z" fill="#75BA24" />
    </g>


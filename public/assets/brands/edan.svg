    <g fill="#464646">
      <!-- E -->
      <path d="M 98,66 L 98,24 L 126,24 L 126,32 L 108,32 L 108,40 L 123,40 L 123,48 L 108,48 L 108,58 L 126,58 L 126,66 Z" />
      <!-- D -->
      <path d="M 136,66 L 136,24 L 154,24 C 166,24 174,32 174,45 C 174,58 166,66 154,66 Z M 146,58 L 153,58 C 160,58 164,53 164,45 C 164,37 160,32 153,32 L 146,32 Z" />
      <!-- A -->
      <path d="M 194,66 L 191,55 L 183,55 L 180,66 L 170,66 L 182,24 L 192,24 L 204,66 Z M 187,36 L 184,48 L 190,48 Z" />
      <!-- N -->
